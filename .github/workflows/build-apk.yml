name: Build Android APK (Le & Mi Contas)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extrair pasta www do ZIP se necessario
        run: |
          if [ ! -f "www/index.html" ] && [ -f "lemi-android-apk-kit.zip" ]; then
            unzip -o lemi-android-apk-kit.zip "www/*" "package.json" "capacitor.config.json"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies & add Android platform
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Le-Mi-Controle-Contas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk